# =============================================================================
#  CONFIGURAÇÃO DO GRUPO .
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  Veja um exemplo completo em exemplos/biblioteca/grupo.yaml.
# =============================================================================

grupo:
  nome: "chatbot RUMO"
  integrantes:          # 3 a 4 integrantes
    - nome: "Guilherme Carvalho de Oliveira"
      rga: "2025.1906.010-4"
    - nome: "Lucas dos Reis Schweich"
      rga: "2025.1906.005-8"
    - nome: "Pedro Cavalcante Sanches"
      rga: "2025.1906.009-0"

tema:
  nome: "Chatbot de mobilidade acadêmica e intercâmbio da UFMS"
  descricao: >
    Busca auxiliar estudantes a se organizarem e tirar duvídas para se prepararem para uma mobilidade acadêmica.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib
  # carregador: "chatbot.meu_modulo:carregar"   # opcional; ver chatbot/modelos.py

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"   # ou o modelo indicado pelo professor
  temperatura: 0.3                       # 0 = respostas mais estáveis; 1 = mais variadas
  max_tokens: 300
  usar_em: [intencoes, chitchat]         # nós em que o LLM redige a resposta
  persona: >
    Você é o RUMO, assistente virtual de mobilidade acadêmica.
    Seja cordial, simples e direto. Responda apenas com base nos trechos.
    Se a informação não estiver neles indique o contato da AGINTER
  contato: "email: aginter@ufms.br telefone: +55 67 3345 3943"
  max_frases: 3
  turnos_historico: 3

# Base de conhecimento (RAG). Coloque os documentos oficiais do tema em
# documentos/ (uma subpasta por intenção + geral/). O índice vetorial é criado
# automaticamente em .vectordb/ na primeira conversa com o LLM.
conhecimento:
  pasta: documentos
  representacao: tfidf        # tfidf (padrão) ou embeddings
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # 0 desliga o recurso. Escolha o valor com base em dados e justifique no relatório.
  limiar_tema: 0.0

# De 5 a 10 intenções. O nome (chave) deve ter só letras minúsculas sem acento,
# dígitos e "_". "descricao" aparece nas mensagens do bot ("Posso ajudar com: ...").
intencoes:
  proficiencia:
    descricao: "Exigência de idioma e certificados aceitos"
    resposta: >
      Depende do destino: cada vaga define o idioma e o nível, geralmente B1
      (espanhol, francês, alemão) ou B2 (inglês), com testes como TOEFL, IELTS
      ou DELF. Confira a vaga no Quadro de Oportunidades da AGINTER.
  custos_auxilio:
    descricao: "Custo do intercâmbio, bolsas e auxílios financeiros"
    resposta: >
      Em geral não há mensalidade, mas passagem, visto, seguro, moradia e
      alimentação são por sua conta. A UFMS oferece bolsa de R$ 1.500 por mês,
      por edital próprio.
  destino_parcerias:
    descricao: "Universidades conveniadas e países disponíveis"
    resposta: >
      As universidades parceiras e as vagas estão no Quadro de Oportunidades
      2026 da AGINTER, com opções em países como Portugal, Espanha, Argentina,
      Colômbia, Alemanha, França, Itália e Japão.
  mobilidade_nacional:
    descricao: "Cursar um período em outra universidade brasileira"
    resposta: >
      Pelo Programa Andifes você pode cursar até dois semestres em outra
      federal, com a vaga garantida na UFMS. É preciso ter 20% do curso
      concluído e no máximo duas reprovações nos dois últimos semestres.
  documentos_viagem:
    descricao: "Visto, passaporte, seguro saúde, vacinas e exigências de entrada em outros países"
    resposta: >
      Você vai precisar de passaporte, visto (se o país exigir) e seguro saúde
      internacional para todo o período. Alguns países pedem o certificado de
      vacinação contra febre amarela.
  inscricao:
    descricao: "Editais abertos, prazos e formas de me candidatar"
    resposta: >
      A inscrição é feita pelo SIGProj (sigproj.ufms.br), escolhendo uma
      universidade do Quadro de Oportunidades dentro do prazo de cada vaga.
      Acompanhe os editais em aginter.ufms.br.
  requisitos:
    descricao: "Requisitos acadêmicos para participação (CRA, semestre, vínculo)"
    resposta: >
      Na graduação, é preciso estar matriculado, ter cursado entre 20% e 80% do
      curso e ter MGA de pelo menos 6,5. Algumas vagas exigem requisitos extras.

# Respostas dos nós que não são intenções. {assuntos} vira a lista de descrições
# das intenções; {opcao1}/{opcao2}, as duas intenções mais prováveis.
respostas:
  chitchat:
    saudacao: "Olá estudante! Sou RUMO, assistente de mobilidade acadêmica da UFMS. Posso ajudar com : {assuntos}"
    agradecimento: "Por nada! Boa sorte com seu intercâmbio!"
    despedida: "Até logo!"
    padrao: "Sou RUMO, um assistente automático e posso ajudar com: {assuntos}."
  fora_dominio: "Desculpe, não sei responder sobre esse assunto. Posso ajudar com: {assuntos}."
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
